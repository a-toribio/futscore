name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || '' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=$((100 + ${{ github.run_number }})) -PversionName=1.0.${{ github.run_number }}

      - name: Prepare FutScore.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FutScore.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutScore-apk
          path: FutScore.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          TITLE="FutScore Android APK (v${VERSION})"
          NOTES="Aplicación móvil Android de FutScore lista para instalar (.apk). Versión: v${VERSION} (commit:${{ github.sha }})"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 FutScore.apk --clobber
            gh release edit v1.0.0 --title "$TITLE" --notes "$NOTES"
          else
            gh release create v1.0.0 FutScore.apk --title "$TITLE" --notes "$NOTES"
          fi
